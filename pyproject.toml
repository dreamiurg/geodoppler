[project]
name = "pinpoint"
version = "0.1.0"
description = "Find where a recording was made from the Doppler curves of small aircraft in its audio"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dmytro Gaivoronsky" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "orjson>=3.11.9",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "rasterio>=1.5.0",
    "scipy>=1.18.0",
]

[project.scripts]
pinpoint = "pinpoint:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Syntax errors and undefined names only: this is research code, style is not gated.
select = ["E9", "F63", "F7", "F82"]
